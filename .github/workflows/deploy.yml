name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - backdev
  pull_request:
    branches:
      - main
      - master
      - backdev
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Lint and Test
  test:
    name: Test Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8

      - name: Lint Python code
        run: |
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend code
        working-directory: ./frontend
        run: npm run build --if-present || true

  # Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/backdev')
    environment:
      name: production
      url: http://74.208.173.203
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          # Create deployment script
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Navigate to project directory
          cd $SERVER_PATH || { echo "❌ Directory not found: $SERVER_PATH"; exit 1; }
          
          # Pull latest code
          echo "📥 Pulling latest code..."
          git fetch origin
          git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          
          # Backup current .env file if it exists
          if [ -f .env ]; then
            echo "💾 Backing up .env file..."
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
          fi
          
          # Stop containers gracefully
          echo "🛑 Stopping containers..."
          docker-compose down || true
          
          # Pull latest images (if using registry)
          echo "📦 Pulling latest images..."
          docker-compose pull || true
          
          # Build and start containers
          echo "🔨 Building and starting containers..."
          docker-compose up -d --build --remove-orphans
          
          # Wait for services to be healthy
          echo "⏳ Waiting for services to start..."
          sleep 10
          
          # Check container status
          echo "📊 Container status:"
          docker-compose ps
          
          # Check backend health
          echo "🏥 Checking backend health..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/v1/health 2>/dev/null || curl -f http://localhost:8000/docs 2>/dev/null; then
              echo "✅ Backend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Backend health check failed"
              docker-compose logs backend | tail -50
              exit 1
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          
          # Check frontend
          echo "🏥 Checking frontend..."
          for i in {1..30}; do
            if curl -f http://localhost:3000 2>/dev/null; then
              echo "✅ Frontend is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Frontend health check failed"
              docker-compose logs frontend | tail -50
              exit 1
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done
          
          # Clean up old images
          echo "🧹 Cleaning up old Docker images..."
          docker image prune -f
          
          # Show recent logs
          echo "📋 Recent backend logs:"
          docker-compose logs --tail=20 backend
          
          echo "✅ Deployment completed successfully!"
          EOF
          
          # Copy and execute deployment script
          scp deploy.sh ${SERVER_USER}@${SERVER_HOST}:/tmp/deploy.sh
          ssh ${SERVER_USER}@${SERVER_HOST} "chmod +x /tmp/deploy.sh && /tmp/deploy.sh"

      - name: Verify deployment
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            cd ${{ secrets.SERVER_PATH }}
            docker-compose ps
            echo ""
            echo "📊 Service URLs:"
            echo "Backend: http://localhost:8000"
            echo "Frontend: http://localhost:3000"
            echo "Nginx: http://localhost:80"
          EOF

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment to production completed successfully!"
          echo "🌐 Application URL: http://${{ secrets.SERVER_HOST }}"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above."
          exit 1

